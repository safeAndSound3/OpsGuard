global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: mysql
    static_configs:
      - targets:
          - mysqld-exporter:9104
        labels:
          instance: monitor-mysql
