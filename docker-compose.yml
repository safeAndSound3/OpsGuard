services:
  mysql:
    image: mysql:8.0
    container_name: monitor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Hh0321}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-monitordb}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - /usr/local/project/mysql:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7.2
    container_name: monitor-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    environment:
      TZ: Asia/Shanghai
    ports:
      - "6379:6379"
    volumes:
      - /usr/local/project/redis:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
  mysql-mock-writer:
    image: mysql:8.0
    container_name: mock-mysql-writer
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-Hh0321}
      TZ: Asia/Shanghai
    volumes:
      - ./scripts/mock/mysql_mock_writer.sh:/mock/mysql_mock_writer.sh:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      mysql:
        condition: service_healthy
    command: ["bash", "/mock/mysql_mock_writer.sh"]
  redis-mock-writer:
    image: redis:7.2
    container_name: mock-redis-writer
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    volumes:
      - ./scripts/mock/redis_mock_writer.sh:/mock/redis_mock_writer.sh:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      redis:
        condition: service_healthy
    command: ["sh", "/mock/redis_mock_writer.sh"]
  nginx:
    image: nginx:stable
    container_name: nginx-opsguard
    restart: unless-stopped
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - /usr/local/project/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
