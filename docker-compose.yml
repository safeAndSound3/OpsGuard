services:
  mysql:
    image: mysql:8.0
    container_name: monitor-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-monitorpass}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-monitordb}
    ports:
      - "3306:3306"
    volumes:
      - monitor-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
  nginx:
    image: nginx:stable
    container_name: nginx-opsguard
    restart: unless-stopped
    ports:
      - "8028:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      mysql:
        condition: service_healthy
volumes:
  monitor-mysql-data:
